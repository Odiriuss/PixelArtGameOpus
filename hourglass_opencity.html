 * THE HOURGLASS CITY - OPEN CITY
 * A slice of New Meridian, 1957, to walk, drive, break into and shoot your way around. Vanilla JS + Canvas 2D.
 * No external assets, fonts, libraries or network requests.
 *
 * ============================== PLAN ==============================
 * CITY     Twelve blocks of Downtown, the Nickel Mile and the South Docks. Surfaces are recorded into display
 *          lists (UNDER: ground and the bottom of every building; OVER: the rest) and baked lazily into 64 px
 *          screen tiles, least recently used thrown away. A tile keeps the light that reaches each pixel, not
 *          its final colour, so the same bake serves noon and midnight: the sun (with building shadows), the
 *          sky, every lamp by id (a lamp can be shot out), neon washes and flicker.
 * INSIDE   Most buildings can be entered. The roof lifts off the one Frank is in; its interior (floors, cut-away
 *          partitions, furniture, lamps) is a display list of its own, baked into tiles of its own. Key
 *          buildings have upper floors, reached by stairs, drawn in place at their height.
 * TIME     One game hour per real minute. Lamps and windows come on at dusk; shops keep their hours.
 * PEOPLE   Pedestrians, shopkeepers, police on the beat, the mob at the docks, Crown Energy's guards.
 *          Guards see with cones (flashlights at night), hear footsteps and shots, and climb a ladder of
 *          suspicion: unaware, suspicious, searching, alerted.
 * GEAR     A paper doll (hat, coat, suit, shoes, gloves, belt, sidearm, long gun, close work, thrown), an 8x6
 *          grid bag, the Buick's trunk, money and a bank account; shops that sell by the box and a few that buy.
 *          Every modifier (armour, stealth, noise, charm, picks...) goes through playerStats(); character
 *          attributes, when they come, are one more source for it (ATTRS).
 * LAW      Heat 0-5. Witnesses report what they saw; cops see it themselves. Patrol cars come by the road grid.
 * WORK     Jobs from the office phone and the payphones. The game saves when he sleeps, when a job pays, and by S
 *          on the pause screen.
 *
 * ZOOM     The world is drawn at a pixel size of its own under the HUD: + and - zoom in and out, and the camera
 *          pulls out by itself at the wheel.
 *
 * PLAY     WASD walk or drive, mouse aim, click shoot, E use, R reload, 1-5 weapons, G throw, C crouch,
 *          Shift run, L flashlight, Tab case the joint, I inventory, M map, J jobs, + - zoom, Esc pause.
 * URL      ?mute=1, ?hour=H start time, ?debug=1, ?god=1, ?turbo=N, ?prof=1 timings, ?auto=1 or ?start=1 skip
 *          the title, ?fresh=1 ignore the save, ?keep=1 keep the save on a new game.

const BAYER = new Float32Array([0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + 0.5) / 16));
function bay(x, y) { return BAYER[((y & 3) << 2) | (x & 3)]; }
function hashi(a, b) {
  let h = Math.imul(a | 0, 0x27d4eb2d) ^ Math.imul(b | 0, 0x165667b1) ^ 0x5bd1e995;
  h = Math.imul(h ^ (h >>> 15), 0x2c1b3c6d);
  h = Math.imul(h ^ (h >>> 12), 0x297a2d39);
  return (h ^ (h >>> 15)) >>> 16;
}
function hash(a, b) { return hashi(a, b) * 1.52587890625e-5; }   // [0,1)
function hash3(a, b, c) { return hash(a + Math.imul(c | 0, 0x9e37), b); }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, t) { return a + (b - a) * t; }

function frac(v) { return v - Math.floor(v); }
// smooth value noise (2D)
function vnoise(x, y, seed) {
  const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
  const a = hash3(xi, yi, seed), b = hash3(xi + 1, yi, seed), c = hash3(xi, yi + 1, seed), d = hash3(xi + 1, yi + 1, seed);
  const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  return lerp(lerp(a, b, u), lerp(c, d, u), v);
}
// deterministic RNG for gameplay-level randomness (ambient only)

  for (let yy = y0; yy < y1; yy++) fb.fill(c, yy * W + x0, yy * W + x1);
}
function remapRect(x, y, w, h, map) {
  if (REMAP_DOWN) REMAP_DOWN(x, y, w, h, map, 1);

  for (let yy = y0; yy < y1; yy++) for (let i = yy * W + x0, e = yy * W + x1; i < e; i++) fb[i] = map[fb[i]];

// =================================================================== THE CITY: GRID, STREETS, SIDEWALKS
// Avenues run along y at AV[i], streets along x at ST[j]; roads are 12 m wide, right-hand traffic. Blocks (c, r) sit
// between them. Downtown is the top two rows, the Nickel Mile the third; the South Docks and the harbour lie south of

    if (rails) { const r = Math.abs(ad - 0.72); if (r < 0.035) return C.S1; if (r < 0.09) return C.BLK; }

// ------------------------------------------------------------------ the road graph (traffic, patrols)
// node id = i * NS + j at (AV[i], ST[j]); lane point for travel along direction (dx, dy) is offset to the right
const NS = ST.length;
function nodeXY(n) { return [AV[Math.floor(n / NS)], ST[n % NS]]; }
function nodeNeighbours(n) {
  const i = Math.floor(n / NS), j = n % NS, out = [];
  if (i > 0) out.push(n - NS); if (i < AV.length - 1) out.push(n + NS); if (j > 0) out.push(n - 1); if (j < NS - 1) out.push(n + 1);
  return out;
}
function nearestNode(x, y) { let best = 0, bd = 1e9; for (let n = 0; n < AV.length * NS; n++) { const [a, b] = nodeXY(n), d = Math.hypot(a - x, b - y); if (d < bd) { bd = d; best = n; } } return best; }
function laneOffset(dx, dy) { return [-dy * LN, dx * LN]; }     // right-hand side of travel (+y is clockwise of +x seen from above)
function lanePath(nodes) {
  const pts = [];
  for (let k = 0; k < nodes.length; k++) {
    const p = nodeXY(nodes[k]);
    if (k === 0 || k === nodes.length - 1) {
      const q = nodeXY(nodes[k === 0 ? 1 : k - 1]), dx = Math.sign(k === 0 ? q[0] - p[0] : p[0] - q[0]), dy = Math.sign(k === 0 ? q[1] - p[1] : p[1] - q[1]);
      const o = laneOffset(dx, dy); pts.push([p[0] + o[0], p[1] + o[1]]); continue;
    }
    const a = nodeXY(nodes[k - 1]), b = nodeXY(nodes[k + 1]);
    const d1 = [Math.sign(p[0] - a[0]), Math.sign(p[1] - a[1])], d2 = [Math.sign(b[0] - p[0]), Math.sign(b[1] - p[1])];
    const o1 = laneOffset(d1[0], d1[1]), o2 = laneOffset(d2[0], d2[1]);
    if (d1[0] === d2[0] && d1[1] === d2[1]) { pts.push([p[0] + o1[0], p[1] + o1[1]]); continue; }
    pts.push([d1[0] ? p[0] + o2[0] : p[0] + o1[0], d1[1] ? p[1] + o2[1] : p[1] + o1[1]]);
  }
  return pts;
}
// the street or avenue a point is on (for the HUD)
function placeName(x, y) {
  for (let j = 0; j < ST.length; j++) if (Math.abs(y - ST[j]) < RW + SWK + 0.5) return STREET_NAMES[j];
  for (let i = 0; i < AV.length; i++) if (Math.abs(x - AV[i]) < RW + SWK + 0.5) return AVENUE_NAMES[i];
  if (y > ST[3] + RW) return 'THE WATERFRONT';
  return '';
}

// =================================================================== ZOOM: THE WORLD AT A PIXEL SIZE OF ITS OWN, UNDER A HUD THAT KEEPS ITS OWN
// The HUD is 320x180, scaled up to the window by a whole number (view.scale). The world is drawn into a layer of
// its own, scaled by a whole number of its own (ZOOM.ws): bigger pixels to come in close, smaller ones to see more
// of the city. + and - step it; at the wheel the camera pulls out by itself and comes back when he gets out, and
// each keeps the step it was last left at. A step eases over a third of a second, the only time a world pixel is
// not a whole number of screen pixels. The HUD layer is clear where the world shows through; a remap drawn on it

// =================================================================== MAIN: DISPLAY, INPUT, THE FIXED-STEP LOOP, THE FRAME
const QS = new URLSearchParams(location.search);

// ------------------------------------------------------------------ input

const BLOCK_KEYS = new Set(['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab']);

});

window.addEventListener('blur', () => { for (const k in INPUT.keys) INPUT.keys[k] = false; INPUT.mdown = false; if (GAME.mode === 'play' && !UI.mode) GAME.mode = 'pause'; });
function mouseAt(e) { INPUT.mx = clamp((e.clientX * view.dpr - view.ox) / view.scale, 0, UW - 1); INPUT.my = clamp((e.clientY * view.dpr - view.oy) / view.scale, 0, UH - 1); INPUT.moved = tick; }

// ------------------------------------------------------------------ one fixed step of the world
function processEvents() {
  for (const e of FXQ) {

      const mine = (e.v && e.v.driver === 'frank') || (e.o && e.o.driver === 'frank');
      if (mine) { shake(Math.min(8, e.j * 0.7)); makeNoise(e.x, e.y, 20); const O = e.v && e.v.driver === 'frank' ? e.o : e.v; if (O && O.M && e.j > 4) crimeAt('vandal', e.x, e.y); }

function worldStep() {

  lifeTick(); sleepTick(); fadeTick(); liftTick();

  let fight = false;

// the dead nobody will look at again are cleared away (their pockets with them)

function update() {

// ------------------------------------------------------------------ the frame
const DRAWQ = [];
const PROF = { on: QS.get('prof') === '1', acc: {}, t: 0 };

function renderWorld() {
  const cx = Math.round(cam.x) + SHAKE.x, cy = Math.round(cam.y) + SHAKE.y;

  const feet = Math.round(isoY(fx, fy, fz)) - cy, mid = CUT.sx - cx;                   // his box on the screen: the man, or the car

  updateNeon();

  cityReflections(); prof('refl');
  gatherLights(); pushTorches();
  applyDynLights(cx, cy); prof('dyn');

}
function drawThrown(cx, cy) { for (const o of THROWN) { const x = Math.round(isoX(o.x, o.y)) - cx, y = Math.round(isoY(o.x, o.y, o.z)) - cy; dpset(x, y, o.key === 'molotov' ? C.G1 : C.CRIM, o.x + o.y + 0.3); dpset(x, y - 1, o.fuse ? C.HOT : C.CREAM, o.x + o.y + 0.3); } }

  hudLayer();

  else {
    if (!UI.mode) drawHud(cx, cy);
    drawDown();

  if (GAME.debug) drawText(GAME.perf.frame.toFixed(1) + ' ms  ' + VEH.length + ' cars  ' + PEOPLE.length + ' people  ' + TILES.size + ' tiles  ' + VW + 'x' + VH, 4, H - 22, C.PALEY);

function drawDebug(cx, cy) {
  for (const S of staticsNear(CAMF.x - 25, CAMF.y - 25, CAMF.x + 25, CAMF.y + 25)) {

// ------------------------------------------------------------------ start up

  if (n === 5) acc = 0;

// =================================================================== THE TEST DRIVER AND THE TEST HOOKS
// A script of plain inputs, run a step at a time: walk to a point (by the walk grid when there is one), press a
// key, hold one, aim at a person, wait. The headless tests queue these and read the state back through __test.
const AUTO = { on: false, q: [], t: 0, walk: null, stuck: 0, log: [] };
function autoInput() {
  if (!AUTO.on || !AUTO.q.length) return;
  const k = INPUT.keys, c = AUTO.q[0];

  if (c.press) { INPUT.pressed[c.press] = true; next(); return; }
  if (c.hold) { k[c.hold] = c.on !== false; next(); return; }
  if (c.click) { INPUT.clicks++; INPUT.mdown = false; next(); return; }
  if (c.aimAt) { const p = typeof c.aimAt === 'function' ? c.aimAt() : c.aimAt; if (p) { const [sx, sy] = worldToScreen(p.x, p.y, (p.z || 0) + 1.1); INPUT.mx = clamp(sx, 0, UW - 1); INPUT.my = clamp(sy, 0, UH - 1); } next(); return; }
  if (c.walk) {
    const [tx, ty] = c.walk, d = Math.hypot(tx - FRANK.x, ty - FRANK.y);
    if (d < (c.near || 0.45) || AUTO.t > (c.ms || 1200)) { if (d >= (c.near || 0.45)) AUTO.log.push('walk timeout ' + tx + ',' + ty + ' at ' + FRANK.x.toFixed(1) + ',' + FRANK.y.toFixed(1)); next(); return; }
    for (const key of ['KeyW', 'KeyA', 'KeyS', 'KeyD']) k[key] = false;
    if (c.run) k.ShiftLeft = true;
    if (!c.path || AUTO.t % 45 === 0) { NAV.z = FRANK.z; NAV.clip = FRANK.F && FRANK.F.f > 0 ? FRANK.F.R : null; buildNav(FRANK.x, FRANK.y); c.path = navPath(FRANK.x, FRANK.y, tx, ty) || [[tx, ty]]; }
    while (c.path.length > 1 && Math.hypot(c.path[0][0] - FRANK.x, c.path[0][1] - FRANK.y) < 0.4) c.path.shift();
    autoWalk(c.path[0][0], c.path[0][1]);

  }

}
function next() { const c = AUTO.q.shift(); AUTO.t = 0; INPUT.keys.ShiftLeft = false; if (c && c.walk) for (const key of ['KeyW', 'KeyA', 'KeyS', 'KeyD']) INPUT.keys[key] = false; }
// the eight ways the keys walk (world directions) and the keys for each; the free one most toward the point wins
const KEY8 = [[1, 0, 'KeyS', 'KeyD'], [1, 1, 'KeyS'], [0, 1, 'KeyS', 'KeyA'], [-1, 1, 'KeyA'], [-1, 0, 'KeyW', 'KeyA'], [-1, -1, 'KeyW'], [0, -1, 'KeyW', 'KeyD'], [1, -1, 'KeyD']];
function autoWalk(tx, ty) {

}
// ------------------------------------------------------------------ hooks for the headless tests
function findB(name) { return BUILDINGS.find(b => b && b.name === name); }
// put Frank somewhere: a point in the street, or a floor of a named building
function teleport(x, y, bname, f) {
  if (PLAYER.car) exitVehicle(true);
  const B = bname ? findB(bname) : null, F = B ? B.floors[f || 0] : null;
  FRANK.B = B; FRANK.F = F; FRANK.z = F && F.f > 0 ? F.z : 0; FRANK.x = x; FRANK.y = y;
  if (!personFree(x, y, 0.3, FRANK.z, FRANK)) { const [lx, ly] = landNear(x, y, FRANK.z); FRANK.x = lx; FRANK.y = ly; }
  if (!B) placePerson(FRANK);
  if (B) { LIFT.b = B; LIFT.f = B.floors.indexOf(F); LIFT.k = 1; LIFT.cut = LIFT.f === 0 ? WCUT : cutZ(F); populateFloor(F); }

}
function setHour(h) { const now = CLOCK.min / 60; passTime(Math.round((((h - now) % 24) + 24) % 24 * 60)); updateLightParams(); updateLamps(); updateDoors(); }

    GAME, PROF, VEH, PEOPLE, STATS, PLAYER, INPUT, AUTO, NAV, CAMF, INV, LAW, JOBS, UI, CLOCK, BUILDINGS, ZONES, CONTAINERS, INTER, DOORS, LIGHTS, LAMPS, LIFT, TILES, ITILES, BAKE_STATS, ITEMS, WEATHER, BANK, CASE, LIGHTM, ROSTER, get FRANK() { return FRANK; },

    begin: () => { while (bakeReady() < 1) prebake(50); GAME.mode = 'play'; CAMF.snap = true; audioPlace(); },

    canSee, lightLevel, frankLight, raiseHeat, spawnGoon, rosterFor, passTime, render, bakeTileNow,

    run: q => { AUTO.on = true; AUTO.q.push(...q); AUTO.t = 0; },
    busy: () => AUTO.q.length > 0,
    state: () => ({ mode: GAME.mode, ui: UI.mode, clock: clockText(), frank: FRANK && [+FRANK.x.toFixed(2), +FRANK.y.toFixed(2), +FRANK.z.toFixed(2), FRANK.B ? FRANK.B.name : null, Math.round(FRANK.hp), FRANK.alive],
      car: PLAYER.car && [+PLAYER.car.x.toFixed(1), +PLAYER.car.y.toFixed(1), PLAYER.car.name], money: INV.money, heat: LAW.heat, prompt: PLAYER.prompt, light: +LIGHTM.v.toFixed(2),
      people: PEOPLE.length, cars: VEH.filter(V => !V.gone).length, perf: { frame: +GAME.perf.frame.toFixed(2), update: +GAME.perf.update.toFixed(2) }, tiles: TILES.size, zoom: [ZOOM.ws, VW, VH], auto: AUTO.log.slice(-5) })
  };
}

// =================================================================== START: BUILD THE CITY, PUT FRANK AT HIS DESK, GO
function newWorld() {
  const B = BUILDINGS.find(b => b && b.key === 'office'), U = B.floors[1];
  const [x, y] = landNear(22.2, 31.0, U.z);

  FRANK.team = 'frank'; FRANK.dir = 1; FRANK.faceX = 0; FRANK.faceY = 1;
  // a private eye's pockets: his old service revolver, a sap, a set of picks, a coat against the rain
  for (const [k, n] of [['service', 1], ['a38', 30], ['blackjack', 1], ['fedora', 1], ['trench', 1], ['suit', 1], ['brogues', 1], ['lockpick', 1], ['bandage', 2], ['smokes', 1], ['carkey', 1]]) {
    const it = newItem(k, n); if (ITEMS[k].slot && !INV.equip[ITEMS[k].slot]) INV.equip[ITEMS[k].slot] = it; else gridAdd(INV.grid, it);

  spawnFrankCar(); spawnParked(); spawnTram(TRAM.y0 + 6, 1); spawnTram(TRAM.y1 - 6, -1);
  for (let k = 0; k < 400; k++) weatherTick();
  updateLightParams(); updateLamps(); updateDoors();
  LIFT.b = B; LIFT.f = 1; LIFT.k = 1; LIFT.cut = cutZ(U);

}

  AUD.muted = QS.get('mute') === '1';
  if (QS.get('hour') !== null) CLOCK.min = ((+QS.get('hour') % 24) + 24) % 24 * 60;
  if (QS.get('god') === '1') PLAYER.god = true;
  const t0 = performance.now();
  buildCity(); buildStaticGrid(); buildLightGrid(); buildCarModels(); buildCast(); buildCombatCast();
  room = CITY_ROOM;
  NAV.r = 0.24;                                              // doorways inside are a metre wide: the walk grid must fit through them
  newWorld();
  buildBigMap();
  GAME.buildMs = performance.now() - t0;
  exposeTest();
  requestAnimationFrame(t => { lastT = t; frame(t); });

init();
