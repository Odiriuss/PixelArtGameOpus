/*
 * THE HOURGLASS CITY - ACT I: THE ORDINARY DEAD
 * An isometric point-and-click noir adventure. New Meridian, Ravenshore, 1957.
 * Vanilla JS + Canvas 2D. No external assets, fonts, libraries or network requests.
 *
 * ============================== PLAN ==============================
 * RENDER  320x180 indexed framebuffer (Uint8 palette indices) + per-pixel depth (Float32),
 *         hotspot id (Uint8) and light tag buffers. Converted once per frame through a
 *         Uint32 palette into ImageData, blitted at the largest integer scale, centred.
 *         Palette: the 53 Ravenshore colours + 7 (coat tan, warm wood, blue neon x2, the
 *         pale green of the lights, two deeper skin tones) = 60. All falloff is 4x4 Bayer
 *         dither; all lighting is palette remaps (LIT warm, SHD cool, tinted neon washes).
 *
 * ISO     World in metres. Screen: sx = (x - y) * 16, sy = (x + y) * 8 - z * 16 (32x16 tiles).
 *         Rooms are rasterised once into cached room buffers: every surface is an
 *         axis-aligned textured rectangle rasterised by inverse projection, so each pixel
 *         knows its world position, normal and depth. A deferred bake then applies point
 *         lights, window/venetian slat light and occlusion shadows as remaps.
 *         Characters are billboards depth-tested at their foot point; their rows are lit by
 *         the same light functions, so blind slats slide across Frank as he walks.
 *         Puddles reflect whatever stands behind them (per-column mirror source, live).
 *
 * PLAY    Left click: walk / use / talk.  Right click: look.  Mouse to top edge or I:
 *         inventory (click an item, then click a target to use it on).  N: notebook -
 *         connect two clues to make a deduction.  WASD / arrows: walk.  E / Space: use
 *         the highlighted thing.  Q: look at it.  Tab: next hotspot.  1-4: dialogue.
 *         Esc: menu (save, load, sound, help).  Clicking Frank gives his read on things.
 *
 * STORY   Adapted from "The Hourglass City" story bible, chapters 1-3.
 *         1 The Letter Under the Door  office, landing          06:50, rain
 *         2 Room 714                   Ferrier St, Mirador lobby, 7th floor, room 714
 *         3 The Blue Comet             the Nickel Mile, club floor, backstage, alley  21:00
 *         Midnight: burn the letter or keep it.  Russo's fate depends on the parked sedan.
 *         Fairness rules from the design docs: goals are stated, methods are not; every
 *         clue reads as a clue; failure teaches; the game is never unwinnable; the
 *         important locks have two keys.
 *
 * LOOP    Fixed 60 Hz update with an accumulator, rAF render. Script runner for
 *         cutscenes and interactions (say / walk / face / wait / fade / choice / call).
 *
 * URL     ?room=ID starts in a room (debug), ?debug=1 draws walk grid and hotspots,
 *         ?nosave=1 ignores the saved game, ?mute=1 starts silent.
 * ===================================================================
 */

const BAYER = new Float32Array([0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + 0.5) / 16));
function bay(x, y) { return BAYER[((y & 3) << 2) | (x & 3)]; }
function hashi(a, b) {
  let h = Math.imul(a | 0, 0x27d4eb2d) ^ Math.imul(b | 0, 0x165667b1) ^ 0x5bd1e995;
  h = Math.imul(h ^ (h >>> 15), 0x2c1b3c6d);
  h = Math.imul(h ^ (h >>> 12), 0x297a2d39);
  return (h ^ (h >>> 15)) >>> 16;
}
function hash(a, b) { return hashi(a, b) * 1.52587890625e-5; }   // [0,1)
function hash3(a, b, c) { return hash(a + Math.imul(c | 0, 0x9e37), b); }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, t) { return a + (b - a) * t; }

function frac(v) { return v - Math.floor(v); }
// smooth value noise (2D)
function vnoise(x, y, seed) {
  const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
  const a = hash3(xi, yi, seed), b = hash3(xi + 1, yi, seed), c = hash3(xi, yi + 1, seed), d = hash3(xi + 1, yi + 1, seed);
  const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  return lerp(lerp(a, b, u), lerp(c, d, u), v);
}
// deterministic RNG for gameplay-level randomness (ambient only)

  let s = rngState[0];

function pset(x, y, c) { if (x >= 0 && y >= 0 && x < W && y < H) fb[y * W + x] = c; }

  const x0 = Math.max(0, x), x1 = Math.min(W, x + w), y0 = Math.max(0, y), y1 = Math.min(H, y + h);
  for (let yy = y0; yy < y1; yy++) fb.fill(c, yy * W + x0, yy * W + x1);
}
function remapRect(x, y, w, h, map) {
  if (REMAP_DOWN) REMAP_DOWN(x, y, w, h, map, 1);
  const x0 = Math.max(0, x), x1 = Math.min(W, x + w), y0 = Math.max(0, y), y1 = Math.min(H, y + h);
  for (let yy = y0; yy < y1; yy++) for (let i = yy * W + x0, e = yy * W + x1; i < e; i++) fb[i] = map[fb[i]];
}
// dithered remap: applies map where bayer < k (k in 0..1)
function ditherRect(x, y, w, h, map, k) {
  if (REMAP_DOWN) REMAP_DOWN(x, y, w, h, map, k);
  const x0 = Math.max(0, x), x1 = Math.min(W, x + w), y0 = Math.max(0, y), y1 = Math.min(H, y + h);
  for (let yy = y0; yy < y1; yy++) for (let xx = x0; xx < x1; xx++) if (bay(xx, yy) < k) fb[yy * W + xx] = map[fb[yy * W + xx]];
}

// =================================================================== AUDIO (WebAudio synthesis, no samples)
const AUD = { ctx: null, muted: false, master: null, noise: null, rain: null, rainF: null, rainG: null,

function audioInit() {
  if (AUD.ctx) { if (AUD.ctx.state === 'suspended') AUD.ctx.resume(); return; }

  if (!AC) return;
  try { AUD.ctx = new AC(); } catch (e) { AUD.ctx = null; return; }
  const ctx = AUD.ctx;
  AUD.master = ctx.createGain(); AUD.master.gain.value = AUD.muted ? 0 : 0.55; AUD.master.connect(ctx.destination);
  const len = ctx.sampleRate * 2, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;

  const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
  AUD.rainF = ctx.createBiquadFilter(); AUD.rainF.type = 'lowpass'; AUD.rainF.frequency.value = 2200;
  const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 300;
  AUD.rainG = ctx.createGain(); AUD.rainG.gain.value = 0;
  src.connect(hp); hp.connect(AUD.rainF); AUD.rainF.connect(AUD.rainG); AUD.rainG.connect(AUD.master); src.start();
  // music bus
  AUD.musicF = ctx.createBiquadFilter(); AUD.musicF.type = 'lowpass'; AUD.musicF.frequency.value = 8000;
  AUD.musicG = ctx.createGain(); AUD.musicG.gain.value = 0;
  AUD.musicF.connect(AUD.musicG); AUD.musicG.connect(AUD.master);

}
function audioApplyMute() { if (AUD.master) AUD.master.gain.setTargetAtTime(AUD.muted ? 0 : 0.55, AUD.ctx.currentTime, 0.05); }
// room ambience: rain level 0..1, rainTone 0 (muffled indoors) .. 1 (outside), music level, music tone
function setAmbience(rain, rainTone, music, musicTone) {
  AUD.want.rain = rain; AUD.want.rainTone = rainTone; AUD.want.music = music; AUD.want.musicTone = musicTone;
  audioApplyAmbience();
}
function audioApplyAmbience() {
  if (!AUD.ctx) return;
  const t = AUD.ctx.currentTime, w = AUD.want;
  AUD.rainG.gain.setTargetAtTime(w.rain * 0.22, t, 0.4);
  AUD.rainF.frequency.setTargetAtTime(400 + w.rainTone * 2600, t, 0.4);
  AUD.musicG.gain.setTargetAtTime(Math.max(w.music, w.song * 0.9) * 0.5, t, 0.6);
  AUD.musicF.frequency.setTargetAtTime(350 + (w.song ? 0.5 : w.musicTone) * 7000, t, 0.6);
}
function env(g, t, a, peak, dec) {
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + dec);
}
function tone(freq, t, dur, type, vol, dest, detune) {

  o.type = type || 'sine'; o.frequency.value = freq; if (detune) o.detune.value = detune;
  env(g, t, 0.005, vol, dur); o.connect(g); g.connect(dest || AUD.master); o.start(t); o.stop(t + dur + 0.05);

}
function noiseBurst(t, dur, vol, ftype, freq, q, dest) {

  s.buffer = AUD.noise; f.type = ftype || 'bandpass'; f.frequency.value = freq || 1000; f.Q.value = q || 1;
  env(g, t, 0.003, vol, dur); s.connect(f); f.connect(g); g.connect(dest || AUD.master);
  s.start(t, Math.random() * 1.5); s.stop(t + dur + 0.05);
}
function sfx(name) {
  if (!AUD.ctx || AUD.muted) return;
  const t = AUD.ctx.currentTime + 0.01;
  switch (name) {
    case 'pick': tone(660, t, 0.12, 'triangle', 0.18); tone(990, t + 0.07, 0.18, 'triangle', 0.14); break;
    case 'note': noiseBurst(t, 0.08, 0.10, 'highpass', 3000, 0.7); noiseBurst(t + 0.09, 0.06, 0.08, 'highpass', 3500, 0.7); break;
    case 'deduce': tone(523, t, 0.5, 'sine', 0.16); tone(622, t + 0.12, 0.6, 'sine', 0.14); tone(784, t + 0.24, 0.9, 'sine', 0.12); break;
    case 'nope': tone(150, t, 0.18, 'triangle', 0.14); break;
    case 'tick': noiseBurst(t, 0.02, 0.12, 'highpass', 2500, 1); break;
    case 'page': noiseBurst(t, 0.22, 0.10, 'bandpass', 1800, 0.6); break;
    case 'door': noiseBurst(t, 0.25, 0.30, 'lowpass', 300, 1); tone(70, t, 0.25, 'sine', 0.25); noiseBurst(t + 0.05, 0.3, 0.05, 'bandpass', 900, 8); break;
    case 'step': noiseBurst(t, 0.04, 0.05, 'bandpass', 700 + Math.random() * 300, 2); break;
    case 'bell': streetcarBell(t); break;
    case 'match': noiseBurst(t, 0.12, 0.25, 'highpass', 2000, 0.8); noiseBurst(t + 0.1, 0.6, 0.08, 'bandpass', 600, 0.5); break;
    case 'burn': for (let i = 0; i < 12; i++) noiseBurst(t + i * 0.09 + Math.random() * 0.05, 0.03, 0.08, 'highpass', 1500, 1); break;
    case 'shot': noiseBurst(t, 0.35, 0.5, 'lowpass', 900, 0.7); tone(55, t, 0.3, 'sine', 0.35); break;
    case 'screech': { const o = AUD.ctx.createOscillator(), g = AUD.ctx.createGain(); o.type = 'sawtooth'; o.frequency.setValueAtTime(900, t); o.frequency.linearRampToValueAtTime(600, t + 0.8);
      const f = AUD.ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1200; f.Q.value = 3; env(g, t, 0.05, 0.08, 0.8); o.connect(f); f.connect(g); g.connect(AUD.master); o.start(t); o.stop(t + 1); break; }
    case 'hum': { const o = AUD.ctx.createOscillator(), g = AUD.ctx.createGain(); o.type = 'sine'; o.frequency.setValueAtTime(180, t); o.frequency.exponentialRampToValueAtTime(1400, t + 4);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.12, t + 2); g.gain.exponentialRampToValueAtTime(0.0001, t + 5); o.connect(g); g.connect(AUD.master); o.start(t); o.stop(t + 5.2); break; }
    case 'lift': noiseBurst(t, 0.4, 0.06, 'bandpass', 400, 2); tone(880, t + 0.5, 0.4, 'sine', 0.08); break;
    case 'clunk': tone(90, t, 0.12, 'square', 0.08); noiseBurst(t, 0.06, 0.15, 'lowpass', 500, 1); break;
    case 'coin': tone(1800, t, 0.15, 'triangle', 0.08); tone(2400, t + 0.05, 0.2, 'triangle', 0.06); break;
    case 'crackle': for (let i = 0; i < 20; i++) noiseBurst(t + Math.random() * 1.5, 0.01, 0.05, 'highpass', 4000, 1); break;
  }
}
function streetcarBell(t) {
  const ding = (u) => { tone(1318, u, 1.1, 'sine', 0.12); tone(2637, u, 0.5, 'sine', 0.05); tone(3950, u, 0.25, 'sine', 0.03); };
  ding(t); ding(t + 0.32); ding(t + 0.95);           // twice, then once more slightly out of rhythm
}
// ------------------------------------------------------------------ looping effects (phone ring, engine idle)
function loopStart(name) {
  if (!AUD.ctx || AUD.loops[name]) return;
  const ctx = AUD.ctx, g = ctx.createGain(); g.gain.value = 0; g.connect(AUD.master);
  const L = { g, nodes: [], iv: 0 };
  if (name === 'phone') {
    const ring = () => {
      if (AUD.muted) return;
      const t = ctx.currentTime + 0.02;
      for (let k = 0; k < 2; k++) {
        const tt = t + k * 0.4;
        const o1 = ctx.createOscillator(), o2 = ctx.createOscillator(), lfo = ctx.createOscillator(), lg = ctx.createGain(), gg = ctx.createGain();
        o1.frequency.value = 440; o2.frequency.value = 480; o1.type = o2.type = 'sine';
        lfo.frequency.value = 20; lg.gain.value = 0.5; lfo.connect(lg); lg.connect(gg.gain);
        gg.gain.setValueAtTime(0.0001, tt); gg.gain.linearRampToValueAtTime(0.10, tt + 0.02); gg.gain.setValueAtTime(0.10, tt + 0.35); gg.gain.linearRampToValueAtTime(0.0001, tt + 0.38);
        o1.connect(gg); o2.connect(gg); gg.connect(AUD.master);
        o1.start(tt); o2.start(tt); lfo.start(tt); o1.stop(tt + 0.4); o2.stop(tt + 0.4); lfo.stop(tt + 0.4);
      }
    };
    ring(); L.iv = setInterval(ring, 2600);
  } else if (name === 'engine') {
    const s = ctx.createBufferSource(); s.buffer = AUD.noise; s.loop = true;
    const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 120;
    const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 38;
    const of = ctx.createBiquadFilter(); of.type = 'lowpass'; of.frequency.value = 200;
    const og = ctx.createGain(); og.gain.value = 0.25;
    s.connect(f); f.connect(g); o.connect(of); of.connect(og); og.connect(g);
    s.start(); o.start(); L.nodes.push(s, o);
    g.gain.setTargetAtTime(0.25, ctx.currentTime, 0.3);
  }
  AUD.loops[name] = L;
}
function loopStop(name) {
  const L = AUD.loops[name]; if (!L) return;
  if (L.iv) clearInterval(L.iv);
  const t = AUD.ctx.currentTime;
  L.g.gain.setTargetAtTime(0, t, 0.1);
  for (const n of L.nodes) { try { n.stop(t + 0.5); } catch (e) { /* already stopped */ } }

}

// =================================================================== FRANK (self-look = hint)
function frankHint() {
  if (G.roomId === 'office' || G.roomId === 'landing') {
    if (!has('envelope') && !has('letter')) return "There's an envelope on my floor. That's new.";
    if (has('envelope')) return "Let's see what's in that envelope. It's in my pocket.";
    if (!flag('read_letter')) return "I should read that note.";
    if (flag('phone_ringing')) return "The phone. At this hour.";
    if (!flag('took_case')) return "Somebody knows my initials and a room number. I'd like to know who.";
    if (!hasClue('d_band') && hasClue('bank_band') && hasClue('herald_lights')) return "The date on that bank band. The date on Saturday's paper. I should put those side by side in my notebook.";
    if (!hasClue('wet_patches') || !hasClue('mopped_six')) return "Whoever left it had to stand on my landing. Landings talk, if you look at them.";
    return "The Mirador's across the street. Room 714.";
  }
  return hintFor(G.roomId);
}
let hintFor = () => "Something here doesn't add up. I just haven't added it yet.";

// =================================================================== NEW GAME / INIT
function storyInit() {
  for (const id in ROOMS) if (ROOMS[id].init) ROOMS[id].init();
}
function newGame() {
  resetGame();
  G.mode = 'play';
  G.inv = ['licence', 'wallet'];
  enterRoom('office', 0.35, 3.75, 'SE');
  S.fade = 1;
  run([
    ['lb', 1],
    ['caption', 'NEW MERIDIAN, RAVENSHORE. 1957.\nFifteen years after a war nobody won.', 4],
    ['caption', 'Three nights after the lights over the harbour.', 3.2],
    ['sfx', 'door'],
    ['fade', 'in', 1.2],
    ['walk', 'frank', 1.35, 3.85, 'SE'],
    ['say', 'frank', "Tuesday. Ten to seven. Rain since before dawn."],
    ['say', 'frank', "I unlocked the street door myself. Nobody's been up those stairs but me."],
    ['clue', 'street_door'],
    ['face', 'frank', 'NW'], ['wait', 0.6],
    ['say', 'frank', "And yet."],
    ['lb', 0],
    ['goal', 'Find out who left the envelope, and why.']
  ]);
}
function debugStart(id) {
  resetGame();

  const s = r.start || [1, 1, 'SE'];
  enterRoom(id, s[0], s[1], s[2]);
}

// ---- the Mirador
clue('master_clock', 'Master clock running', "The Mirador's master regulator behind the front desk drives every clock in the building over two wires. Running, right on time. Pell says it hasn't lost a second since 1931.");
clue('dials_217', 'Every dial on seven: 2:17', "All three slave dials on the seventh floor stopped at 2:17. A slave dial can't stop unless the master stops.");
clue('blank_register', 'Seventh floor left blank', "The register shows seven rooms on the seventh floor taken since the 12th. Room numbers, no names.");
clue('block_booking', 'A federal block-booking', "Pell: the whole seventh floor was block-booked by the government from the 12th. Management told him not to write it down.");
clue('desk_nobody', 'Nobody passed the desk', "Pell was on the front desk all night. He swears nobody went upstairs after midnight.");
clue('east_stairs', 'The east stairs', "The seventh floor's east fire stairs come down by the kitchens, not the lobby. Nobody at the front desk would see who used them.");
clue('carbon_book', 'Carbon book: 7-0411', "The room-service carbon book in the seventh-floor pantry. The last docket written is 7-0411. The next blank in the pad is 7-0412.");
clue('shot_heart', 'Shot through the heart', "Evelyn Hart, shot once through the heart. No gun in the room.");
clue('captain_gangster', "Captain says 'gangster'", "Russo's captain named Mickey Salvi before the medical examiner got his hat off. Evelyn sang at Salvi's club.");
clue('locked_door', 'Locked from the inside', "Key in the lock on the inside and the chain on. Mulroney had to cut the chain to get in.");
clue('window_latched', 'Sealed room', "Window latched. Seventh floor, north face, no ledge, no fire escape. Transom painted shut. Connecting door bolted on both sides.");
clue('cold_latch', 'Frost on the window latch', "A grey-white bloom around the window latch. Not scorched. Cold. Frost, in June.");
clue('frost_glass', 'Frost on her water glass', "The glass of water by the bed has a skin of frost on the surface. The room is warm.");
clue('mirror_spiral', 'Mirror cracked in a spiral', "The mirror on the dresser is cracked in a spiral, as if something twisted it. Shifted in its frame, not shattered.");
clue('locket_empty', 'The locket is empty', "Evelyn's locket, open on the dresser. The photograph wasn't torn out. Somebody lifted it out carefully.");
clue('ash_tray', 'Pall Royale ash', "Ash and two stubs in the ashtray by the armchair. Pall Royale.");
clue('her_brand', 'She smoked Lucky Sevens', "Evelyn's handbag: a half pack of Lucky Sevens, a Blue Comet set list, a streetcar token.");
clue('receipt_tomorrow', 'A receipt dated tomorrow', "A room-service receipt on the tray: docket 7-0412, stamped JUN 19 1957. Today is the 18th. Written in block capitals.");
clue('clock_217', 'Bedside clock: 2:17', "The travel clock by the bed stopped at 2:17. It's a wind-up, and it's fully wound.");
// ---- the Blue Comet
clue('salvi_cigar', 'Mickey smokes Havanas', "Mickey Salvi smokes Havanas and nothing else, and he tells you so. He wouldn't be seen dead with a Pall Royale.");
clue('salvi_streetcar', 'Mickey took the streetcar', "Lou: Mickey's Lincoln wouldn't start last night. Somebody pulled the distributor cap. He took the Nickel Mile streetcar home at five to two.");
clue('no_lipstick', 'No lipstick on her vanity', "Evelyn's dressing table at the Blue Comet: powder, pins, cold cream, a hat pin. No lipstick. A singer always has lipstick.");
clue('hooks', 'Mirror on two hooks', "Her dressing-room mirror hangs on two brass hooks, not screws. It was made to come off.");
clue('lipstick_message', 'Behind the mirror', "In lipstick, in her hand: 'If I am dead, the song is the map. The sky opened at 2:17. Ask Sloane what came through.'");
clue('mags_sky', 'Afraid of the sky', "Mags: since Saturday Evelyn wouldn't go up on the roof for a smoke. She kept the blinds down and said the sky had a hole in it.");
clue('acetate', "Evelyn's last rehearsal", "Roy Teague cut Evelyn's last rehearsal on the band-room lathe five days ago. One acetate disc.");
clue('acetate_pulse', 'A pulse under the song', "On the acetate, under the music, a tick that isn't in time with anything. A flaw in the disc, or something else.");
clue('rime_rung', 'Frost on the fire escape', "The bottom rung of the fire escape behind the Blue Comet is furred with frost. In June.");

// ------------------------------------------------------------------ the call
function rookCall() {
  loopStop('phone'); setFlag('phone_ringing', false);
  const accept = () => [['choice', [
    { t: "I'll take the case.", d: () => rookEnd() },
    { t: "What does it pay?", d: [['say', 'rook', "Twenty a day and expenses. The expenses had better be expenses."], ['fn', accept]] },
    { t: "Find somebody else.", d: [['say', 'rook', "There isn't anybody else, Calder. That's rather the point."], ['fn', accept]] }
  ]]];
  return [
    ['sfx', 'clunk'], ['pose', 'frank', 'reach', 0.4, true],
    ['say', 'frank', "Calder."],
    ['say', 'rook', "Mr. Calder. Chester Rook, the Herald."],
    ['say', 'rook', "A singer named Evelyn Hart was found dead this morning at the Hotel Mirador. Room seven-fourteen."],
    ['wait', 0.5],
    ['say', 'frank', "Seven-fourteen."],
    ['say', 'rook', "The police will have a gangster in handcuffs by lunch. I'd like someone to look at it who won't be finished by lunch."],
    ['choice', [
      { t: '[Charm] The Herald must be doing well, if it can afford me.', once: 'rook1',
        d: [['say', 'rook', "The Herald is doing terribly. I'm paying out of my own pocket. I trust that tells you something."]] },
      { t: '[Pressure] Why me, Rook? And why the hurry?',
        d: [['say', 'rook', "Because you're the only man in this city who walked off the force rather than lose a file."], ['say', 'rook', "And because she mentioned you. Once."]] },
      { t: '[Empathy] You knew her.',
        d: [['say', 'rook', "She brought me a story last week. Something about the Asterion plant. I told her to come back with proof."], ['wait', 0.6],
            ['say', 'rook', "She's dead, Calder."], ['clue', 'rook_refused'], ['flag', 'rook_trust']] },
      { t: '[Silence] ...', say: '',
        d: [['wait', 1.2], ['say', 'rook', "...She came to me with a story about Asterion. I wanted proof before I'd print a word. I suppose she was out getting it."], ['clue', 'rook_refused']] }
    ]],
    ['say', 'rook', "Will you take it?"],
    ['fn', accept]
  ];
}
function rookEnd() {
  return [
    ['say', 'rook', "Good. Detective Russo has the scene. She won't be pleased to see you."],
    ['say', 'frank', "She never is."],
    ['sfx', 'clunk'],
    ['clue', 'case_714'], ['flag', 'took_case'],
    ['say', 'frank', "'When they ask about the girl in room 714, take the case.'"],
    ['say', 'frank', "Somebody knew. Before the police did. Before Rook did."],
    ['goal', 'Get across the street to the Hotel Mirador, room 714.'],
    ['save']
  ];
}

function gusTalk() {
  const pay = (amt) => [['sfx', 'coin'], ['flag', 'paid_cover'], ['flag', 'spent_cover'], ['say', 'doorman', amt === 4 ? "Four. Pleasure doing business with the private sector." : "Enjoy the music. Don't enjoy it loud."],
    ['walk', 'doorman', 6.9, 1.5, 'SW'], ['goal', "Find out what Evelyn left behind at the Blue Comet."]];
  const menu = () => [['choice', [
    { t: "Customer. (pay two dollars)", c: () => !flag('paid_cover') && !flag('gus_private'), d: () => pay(2) },
    { t: "I'm a private detective.", c: () => !flag('paid_cover') && !flag('gus_private'),
      d: [['flag', 'gus_private'], ['say', 'doorman', "I know. Cops don't pay and they don't wait. You're waiting, so you're private."], ['say', 'doorman', "Privates pay double. Four dollars."], ['fn', menu]] },
    { t: "Fine. Four dollars.", c: () => !flag('paid_cover') && flag('gus_private'), d: () => pay(4) },
    { t: "I'm here about Evelyn.", once: 'gus_ev',
      d: [['say', 'doorman', "Everybody's here about Evelyn tonight. Band's playing her set without her. Place is full of people who never bought her a drink."],
          ['say', 'doorman', "She went out the back last night, twenty past twelve. The alley. She always used the alley. Said the front had too many eyes."], ['fn', menu]] },
    { t: "Never mind.", d: [] }
  ]]];
  if (flag('paid_cover')) return [['say', 'doorman', "You're paid up. Go on in."]];
  if (flag('gus_met')) return [['say', 'doorman', "Still out here?"], ['fn', menu]];
  setFlag('gus_met');
  return [['say', 'doorman', "Evening."], ['wait', 0.8], ['say', 'doorman', "Customer, cop, or problem?"], ['fn', menu]];
}

// =================================================================== BLUE COMET: CONVERSATIONS
function openBackstage(how) {
  return [['flag', 'backstage_ok'], ['flag', 'backstage_' + how], ['walk', 'goon', 9.7, 6.75, 'SW'],
    ['goal', "Get backstage and look through Evelyn's dressing room."]];
}
function brunoBlock() {
  if (flag('backstage_ok')) return [['say', 'goon', "You been cleared. Go on."]];
  if (has('wreath')) return brunoWreath();
  return [['face', 'goon', 'frank'], ['say', 'goon', "Mr. Salvi says nobody goes back there tonight."], ['say', 'frank', "Did Mr. Salvi say why?"], ['say', 'goon', "No."]];
}
function brunoWreath() {
  if (flag('backstage_ok')) return [['say', 'goon', "You been cleared already."]];
  return [['face', 'goon', 'frank'], ['say', 'frank', "Flowers for Miss Hart's room. From the band."],
    ['say', 'goon', "..."], ['wait', 0.6], ['say', 'goon', "Mags'll want 'em. You go in with the flowers, you come out without 'em. Quick."]].concat(openBackstage('wreath'));
}
function wreathTake() {
  return [['pose', 'frank', 'reach', 0.6, true], ['flag', 'got_wreath'], ['give', 'wreath'],
    ['say', 'bartender', "Hey. Those are for the back. Mags is supposed to put 'em in her room."],
    ['say', 'frank', "I'm headed that way."], ['say', 'bartender', "...Sure you are. Tell Bruno the boys sent 'em."]];
}
// ------------------------------------------------------------------ Lou, behind the bar
function louTalk() {
  const menu = () => [['choice', [
    { t: "[Buy] A rye. (a dollar)", c: () => !flag('lou_rye'),
      d: [['flag', 'lou_rye'], ['sfx', 'coin'], ['pose', 'bartender', 'reach', 0.8, true], ['say', 'bartender', "Rye. On a night like this, a man should drink something brown."], ['fn', menu]] },
    { t: "Was Mickey here last night?",
      d: () => flag('lou_rye') ? [['say', 'bartender', "End of my bar till half past one, crying into a gin. Then his Lincoln wouldn't start."],
          ['say', 'bartender', "Somebody'd pulled the distributor cap. Mickey's still looking for who. He took the Nickel Mile car home at five to two, cussing the whole way."],
          ['clue', 'salvi_streetcar'], ['fn', menu]]
        : [['say', 'bartender', "I pour drinks, mister. I don't pour Mickey."], ['fn', menu]] },
    { t: "When did Evelyn leave?", once: 'lou_left',
      d: [['say', 'bartender', "Twenty past twelve. Out the back, through the alley. She always went out the alley."],
          ['say', 'bartender', "Said the front had too many eyes."], ['fn', menu]] },
    { t: "Anybody call for her?", c: () => flag('lou_rye') || flag('said_lou_left'),
      d: [['say', 'bartender', "Twice. A fella at twenty to twelve. She took it in the alcove, back turned, didn't say much."],
          ['say', 'bartender', "Then Chester Rook, from the Herald, ten to twelve. Left a message with me: he can't be part of it."],
          ['say', 'bartender', "She read it, and she went and got her coat."], ['flag', 'lou_calls'], ['fn', menu]] },
    { t: "The wreath at the end of the bar?", c: () => !flag('got_wreath'),
      d: [['say', 'bartender', "The boys chipped in. It's supposed to go back to her dressing room. Mags'll know what to do with it."],
          ['say', 'bartender', "I can't leave the bar. Nobody else'll touch it. Bad luck, carrying flowers for the dead."], ['fn', menu]] },
    { t: "That's all.", d: [['say', 'bartender', "Always is."]] }
  ]]];
  if (flag('lou_met')) return [['say', 'bartender', "What'll it be?"], ['fn', menu]];
  setFlag('lou_met');
  return [['say', 'bartender', "What'll it be?"], ['say', 'frank', "Answers, mostly."], ['say', 'bartender', "We're out. Try a drink."], ['fn', menu]];
}
// ------------------------------------------------------------------ Mickey Salvi, in his booth
function salviTalk() {
  const menu = () => [['choice', [
    { t: "Where were you at two this morning?",
      d: [['say', 'salvi', "Here till half past one. Then my car wouldn't start. Some comedian pulled the distributor cap."],
          ['say', 'salvi', "So I rode the streetcar home like a working man. Ask the conductor. He'll remember. I tipped him."], ['fn', menu]] },
    { t: "What did she want from you last night?", once: 'mick_want',
      d: [['say', 'salvi', "Not what you'd think. She wanted money. Not for her."],
          ['say', 'salvi', "She said she had something to sell. A name and a date. She needed somebody with money to be scared with her."],
          ['say', 'salvi', "I told her I don't buy what I can't lift. She called me a coward. She was right. She usually was."], ['fn', menu]] },
    { t: "The captain's got your name on this.", c: () => hasClue('captain_gangster') && !flag('backstage_ok'),
      d: [['say', 'salvi', "The captain's had my name on everything since the weather in '52."],
          ['say', 'salvi', "I didn't kill her, Calder. I'd have married her if she'd let me. She wouldn't."],
          ['choice', [
            { t: "[Persuade] Then let me see her dressing room. I'll find you somebody else to hang.",
              d: [['wait', 0.6], ['say', 'salvi', "..."], ['say', 'salvi', "Bruno. Let the man through."], ['fn', () => openBackstage('mickey')]] },
            { t: "[Pressure] You're the only man in this room with a reason.",
              d: [['say', 'salvi', "Everybody in this room's got a reason, Calder. Most of 'em are at the bar."], ['fn', menu]] }
          ]]] },
    { t: "[Observe] That's a good cigar.", once: 'mick_cigar',
      d: [['say', 'salvi', "Havana. I don't smoke anything rolled north of Key West. Never have."],
          ['say', 'salvi', "Cigarettes are for people waiting on something. I don't wait."], ['clue', 'salvi_cigar'], ['fn', menu]] },
    { t: "That's all, Mickey.", d: [['say', 'salvi', "Find who did it, Calder. Then tell me before you tell the cops."]] }
  ]]];
  if (flag('mick_met')) return [['say', 'salvi', "Calder."], ['fn', menu]];
  setFlag('mick_met');
  return [['say', 'salvi', "Frank Calder. The cop who quit before they could fire him. I heard you'd come. I hear everything in my club."],
    ['say', 'frank', "Then you heard about Evelyn before I did."], ['wait', 0.6],
    ['say', 'salvi', "Siddown or stand up, I don't care. Just don't stand there looking like the police."], ['fn', menu]];
}

  if (UI.invPinned && G.inv.length) { const i = UI.kbInv || 0; rectOutline(INV_X0 + i * INV_SLOT - 1, Math.round(UI.invY) + 2, 18, 19, C.GLOW); const nm = ITEMS[G.inv[i]].name; drawTextOutlined(nm, clamp(INV_X0 + i * INV_SLOT + 8 - (textWidth(nm) >> 1), 2, W - textWidth(nm) - 2), 28, C.CREAM); }
  drawLetterbox();
  drawChoices();
  if (UI.note) drawNotebook();
  if (S.doc) drawDoc();
  drawToast();
  applyFade();
  if (!UI.note && !S.doc && !UI.menu) drawCaption();
  if (UI.menu) drawMenu();
  if (UI.help) drawHelp();
  drawCursor();
  present();
}
// very sparse film grain on the darkest colours
const GRN = new Uint8Array(256); [[0, 1], [1, 0], [2, 1], [11, 12], [22, 1], [27, 26], [28, 2], [40, 1], [44, 1], [48, 0], [13, 2]].forEach(p => { GRN[p[0]] = p[1] + 1; });
function grain() {
  const seed = (tick / 5) | 0;
  for (let k = 0; k < 400; k++) {
    const p = hashi(seed, k * 7 + 1) * 57600 >>> 16;
    const g = GRN[fb[p]]; if (g) fb[p] = g - 1;
  }
}
function debugOverlay(cx, cy) {
  const gr = room.grid;
  for (let j = 0; j < gr.gh; j++) for (let i = 0; i < gr.gw; i++) {
    if (!gr.g[j * gr.gw + i]) continue;
    const x = gr.x0 + (i + 0.5) * GRID, y = gr.y0 + (j + 0.5) * GRID;
    pset(toScreenX(x, y), toScreenY(x, y, 0), C.G3);
  }
  room.hotspots.forEach(hs => { const p = hs.at; if (p) pset(toScreenX(p[0], p[1]), toScreenY(p[0], p[1], 0), C.RED); });
  drawText(room.id + ' ' + ACT.frank.x.toFixed(2) + ',' + ACT.frank.y.toFixed(2), 2, H - 10, C.CYAN);
}

// =================================================================== SAVE / LOAD
const SAVE_KEY = 'hourglass_city_act1_v1';
function saveGame() {
  const fr = ACT.frank;
  const data = { G: { flags: G.flags, inv: G.inv, clues: G.clues, deds: G.deds, goal: G.goal, chapter: G.chapter },
                 room: G.roomId, x: fr.x, y: fr.y, dir: fr.dir, visited: Object.keys(ROOMS).filter(k => ROOMS[k].visited) };
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(data)); return true; } catch (e) { toast('Could not save (storage unavailable).'); return false; }
}
function savedGame() {
  if (QS.get('nosave') === '1') return null;
  try { const s = localStorage.getItem(SAVE_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; }
}
function loadGame() {
  const d = savedGame(); if (!d || !ROOMS[d.room]) return false;
  resetGame();
  G.flags = d.G.flags || {};
  for (const k in G.flags) if (/_t$/.test(k) && typeof G.flags[k] === 'number') G.flags[k] = tick;   // frame timers restart from the load
  G.inv = d.G.inv || []; G.clues = d.G.clues || []; G.deds = d.G.deds || []; G.goal = d.G.goal || ''; G.chapter = d.G.chapter || 1;
  (d.visited || []).forEach(k => { if (ROOMS[k]) ROOMS[k].visited = true; });
  G.mode = 'play';
  enterRoom(d.room, d.x, d.y, d.dir);
  S.fade = 1; run([['fade', 'in', 0.5]]);
  return true;
}
function resetGame() {
  S.q.length = 0; S.cur = null; S.speech = null; S.choice = null; S.doc = null; S.caption = null; S.lb = S.lbTo = 0;
  G.flags = {}; G.inv = []; G.clues = []; G.deds = []; G.sel = null; G.goal = ''; G.newNotes = 0; G.chapter = 1;
  UI.note = false; UI.menu = false; UI.help = false; UI.invPinned = false;
  for (const k in ROOMS) ROOMS[k].visited = false;
  loopsStopAll(); playSong(false);
}

// =================================================================== MAIN LOOP
const clk = new Float64Array(3); clk[1] = -1;
function frameLoop(now) {
  if (clk[1] < 0) clk[1] = now;
  let dt = (now - clk[1]) / 1000; clk[1] = now;
  if (dt > 0.25) dt = 0.25;
  clk[0] += dt * TURBO;
  let steps = 0;
  while (clk[0] >= DT && steps < 8 * TURBO) { update(); clk[0] -= DT; steps++; }
  if (steps === 8 * TURBO) clk[0] = 0;
  render();
  requestAnimationFrame(frameLoop);
}
function init() {
  resize();
  buildCast();
  for (const id in CAST) ACT[id] = makeActor(id);
  ACT.patronM2 = makeActor('patronM2', 'patronM'); ACT.patronF2 = makeActor('patronF2', 'patronF');
  storyInit();
  if (QS.get('mute') === '1') AUD.muted = true;
  const start = QS.get('room');
  if (start && ROOMS[start]) { G.mode = 'play'; debugStart(start); }
  else toTitle();
  screen.focus();
  requestAnimationFrame(frameLoop);
}
window.__game = { G, S, ACT, ROOMS, ITEMS, CLUES, DEDS, enterRoom, run, interact, connect, get room() { return room; }, get actors() { return actors; }, hotspotById, UI, chooseOption,
                  cam, saveGame, loadGame, keys, newGame, useItemOnItem, lookItem, scriptBusy, get tick() { return tick; } };
init();

</script>
