 * THE HOURGLASS CITY - TEST LEVEL: THE BLACK SEDAN
 * Driving and gunplay on the Hourglass City engine. New Meridian, 1957, a quarter to midnight, rain.
 * Vanilla JS + Canvas 2D. No external assets, fonts, libraries or network requests.
 *
 * ============================== PLAN ==============================
 * CITY    Six blocks, four avenues, three streets, the harbour and Pier 9. Every surface is recorded in two
 *         display lists (UNDER: ground, kerbs, low props, the bottom 1.2 m of buildings; OVER: the rest) and
 *         baked lazily into 64 px screen tiles with the room light model. Each frame the visible tiles are
 *         composed and the OVER layer in front of Frank is cut away, so the street you are on stays visible.
 * CARS    Voxel models pre-rendered at 64 headings (per-pixel depth, paint ramps, working lights).
 *         Arcade rigid-body physics: grip, handbrake slides, impulse collisions with spin, damage, fire.
 *         Any parked car can be taken. AI drivers follow lanes by pure pursuit; traffic, a streetcar.
 * GUNS    Hitscan with spread, 3D cover (crouch behind anything lower than your head), reloads.
 *         Goons pick cover that hides them from Frank, pop up to shoot, flank, and retreat when hurt.
 * LEVEL   Intro at the Blue Comet -> the chase (ram it, shoot it, don't lose it) -> the fight where the
 *         sedan stops -> what the leader had in his pocket.
 *
 * PLAY    On foot: WASD move, mouse aim, left click shoot, right click / C crouch, R reload, E car.
 *         Driving: W/S gas and brake, A/D steer, Space handbrake, E get out, left click shoot out the window,
 *         H horn. F fires at the nearest enemy (keyboard play). Esc: pause.
 * URL     ?mute=1 silent, ?start=chase|fight skips ahead, ?debug=1 draws collision and AI, ?god=1,
 *         ?turbo=N runs the simulation faster, ?auto=1 lets the test driver play.
 * ===================================================================
 */

// ------------------------------------------------------------------ math / noise helpers
const BAYER = new Float32Array([0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + 0.5) / 16));
function bay(x, y) { return BAYER[((y & 3) << 2) | (x & 3)]; }
function hashi(a, b) {
  let h = Math.imul(a | 0, 0x27d4eb2d) ^ Math.imul(b | 0, 0x165667b1) ^ 0x5bd1e995;
  h = Math.imul(h ^ (h >>> 15), 0x2c1b3c6d);
  h = Math.imul(h ^ (h >>> 12), 0x297a2d39);
  return (h ^ (h >>> 15)) >>> 16;
}
function hash(a, b) { return hashi(a, b) * 1.52587890625e-5; }   // [0,1)
function hash3(a, b, c) { return hash(a + Math.imul(c | 0, 0x9e37), b); }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, t) { return a + (b - a) * t; }
function smooth(t) { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); }
function frac(v) { return v - Math.floor(v); }
// smooth value noise (2D)
function vnoise(x, y, seed) {
  const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
  const a = hash3(xi, yi, seed), b = hash3(xi + 1, yi, seed), c = hash3(xi, yi + 1, seed), d = hash3(xi + 1, yi + 1, seed);
  const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  return lerp(lerp(a, b, u), lerp(c, d, u), v);
}
// deterministic RNG for gameplay-level randomness (ambient only)
const rngState = new Uint32Array([0x9e3779b9]);
function rnd() {
  let s = rngState[0];

}

function pset(x, y, c) { if (x >= 0 && y >= 0 && x < W && y < H) fb[y * W + x] = c; }
function fillRect(x, y, w, h, c) {
  const x0 = Math.max(0, x), x1 = Math.min(W, x + w), y0 = Math.max(0, y), y1 = Math.min(H, y + h);
  for (let yy = y0; yy < y1; yy++) fb.fill(c, yy * W + x0, yy * W + x1);
}
function remapRect(x, y, w, h, map) {
  const x0 = Math.max(0, x), x1 = Math.min(W, x + w), y0 = Math.max(0, y), y1 = Math.min(H, y + h);
  for (let yy = y0; yy < y1; yy++) for (let i = yy * W + x0, e = yy * W + x1; i < e; i++) fb[i] = map[fb[i]];
}
// dithered remap: applies map where bayer < k (k in 0..1)
function ditherRect(x, y, w, h, map, k) {
  const x0 = Math.max(0, x), x1 = Math.min(W, x + w), y0 = Math.max(0, y), y1 = Math.min(H, y + h);
  for (let yy = y0; yy < y1; yy++) for (let xx = x0; xx < x1; xx++) if (bay(xx, yy) < k) fb[yy * W + xx] = map[fb[yy * W + xx]];
}
function hline(x0, x1, y, c) { for (let x = x0; x <= x1; x++) pset(x, y, c); }

const FONT_H = 9, LINE_H = 10, SPACE_W = 3;
const glyphW = new Uint8Array(128), glyphBits = [];
(function buildFont() {
  for (let c = 0; c < 128; c++) glyphBits[c] = null;
  for (const ch in FONT_SRC) {
    const rows = FONT_SRC[ch].split('|'), w = rows[0].length, bits = new Uint8Array(w * FONT_H);
    for (let r = 0; r < rows.length; r++) for (let x = 0; x < w; x++) if (rows[r][x] === '#') bits[r * w + x] = 1;
    glyphW[ch.charCodeAt(0)] = w; glyphBits[ch.charCodeAt(0)] = bits;
  }
})();
function charW(code) { return code === 32 ? SPACE_W : (glyphBits[code] ? glyphW[code] : 4); }
function textWidth(s) {
  let w = 0;
  for (let i = 0; i < s.length; i++) w += charW(s.charCodeAt(i)) + 1;
  return w > 0 ? w - 1 : 0;
}
function drawChar(code, x, y, c) {
  const bits = glyphBits[code]; if (!bits) return;
  const w = glyphW[code];
  for (let r = 0; r < FONT_H; r++) for (let i = 0; i < w; i++) if (bits[r * w + i]) pset(x + i, y + r, c);
}
// plain text
function drawText(s, x, y, c) {
  for (let i = 0; i < s.length; i++) { const k = s.charCodeAt(i); drawChar(k, x, y, c); x += charW(k) + 1; }
  return x;
}
// text with a 1px dark outline (legible over any background)
function drawTextOutlined(s, x, y, c, oc) {
  if (oc === undefined) oc = C.BLK;
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) if (dx || dy) drawText(s, x + dx, y + dy, oc);
  drawText(s, x, y, c);
}
function drawTextShadow(s, x, y, c, sc) { drawText(s, x + 1, y + 1, sc === undefined ? C.BLK : sc); drawText(s, x, y, c); }
// greedy word wrap -> array of lines
function wrapText(s, maxW) {
  const out = [], paras = s.split('\n');
  for (const p of paras) {
    const words = p.split(' ');
    let line = '';
    for (const w of words) {
      const test = line ? line + ' ' + w : w;
      if (textWidth(test) <= maxW || !line) line = test;
      else { out.push(line); line = w; }
    }
    out.push(line);
  }
  return out;
}

    return bay(px, py) < 0.2 ? E(C.HOT) : E(C.GLOW);
  }
  // an ordinary lit shop window with goods in it
  if (frac(lu / 1.6) < 0.04) return C.ST0;
  if (z < 1.1 && hash3(Math.floor(lu / 0.4), 1, s.u0 | 0) > 0.55) return E(hash(Math.floor(lu / 0.4), s.u0 | 0) > 0.5 ? C.CORAL : C.BRASS);
  return bay(px, py) < 0.3 ? E(C.GLOW) : E(C.AMB);
}
// roofs: tar with vents; cap: the dark cut surface seen when the top of a building is cut away
function roofSh(seed) { return (x, y, px, py) => (frac(x / 2.5) < 0.03 || frac(y / 2.5) < 0.03) ? C.ST0 : (vnoise(x * 0.8, y * 0.8, seed) + bay(px, py) * 0.2 > 0.75 ? C.ST0 : C.INK); }

// ------------------------------------------------------------------ a building: split into UNDER and OVER at ZCUT
// b: {x0, y0, x1, y1, h, fx: facade for the +x face (u, z), fy: for the +y face, roof, noCol}
function building(b) {
  const zc = Math.min(ZCUT, b.h);
  const shX = b.fx ? (y, z, px, py) => b.fx(b.y1 - y, z, px, py) : flat(C.INK);
  const shY = b.fy ? (x, z, px, py) => b.fy(x - b.x0, z, px, py) : flat(C.INK);
  layer(0); mat(MAT_OUTSIDE);
  cWallX(b.x1, b.y0, b.y1, 0, zc, shX); cWallY(b.y1, b.x0, b.x1, 0, zc, shY);
  cFloor(b.x0, b.y0, b.x1, b.y1, zc, capSh(b));

    layer(1);
    cWallX(b.x1, b.y0, b.y1, zc, b.h, shX); cWallY(b.y1, b.x0, b.x1, zc, b.h, shY);
    cFloor(b.x0, b.y0, b.x1, b.y1, b.h, b.roof || roofSh(b.seed || 3));
    // parapet along the two visible roof edges
    cBox(b.x1 - 0.25, b.y0, b.h, b.x1, b.y1, b.h + 0.5, flat(C.ST1), flat(C.ST0), flat(C.ST0));
    cBox(b.x0, b.y1 - 0.25, b.h, b.x1 - 0.25, b.y1, b.h + 0.5, flat(C.ST1), flat(C.ST0), flat(C.ST0));
    layer(0);

}
function waterTower(x, y, z) {
  layer(1);
  for (const [dx, dy] of [[-0.8, -0.8], [0.8, -0.8], [-0.8, 0.8], [0.8, 0.8]]) cCyl(x + dx, y + dy, 0.06, z, z + 2.2, () => C.INK);
  cCyl(x, y, 1.3, z + 2.2, z + 4.4, (a, zz) => frac(a * 3 + 5) < 0.1 ? C.INK : (a < -0.2 ? C.BRN : C.DBR), () => C.DBR);
  cCyl(x, y, 1.35, z + 4.4, z + 4.9, (a) => a < -0.2 ? C.ST1 : C.ST0, () => C.ST1);
  layer(0);
}
function roofBox(x0, y0, x1, y1, z, h) { layer(1); cBoxC(x0, y0, z, x1, y1, z + h, C.ST1, C.ST0, C.INK); layer(0); }

// ------------------------------------------------------------------ neon and signs (tagged: they flicker with lightState)
// text on a +x face (plane x = xw, u from the face's right end y1) or a +y face (plane y = yw, u from x0)
function neonTextX(xw, y1, u0, zTop, text, col, tg, sc) {
  const s = sc || 1, tw = textWidth(text) * s / 16;
  layer(zTop > ZCUT + 0.6 ? 1 : 0); mat(MAT_OUTSIDE); tag(tg || 0);
  cWallX(xw + 0.02, y1 - u0 - tw - 0.1, y1 - u0 + 0.1, zTop - 9 * s / 16 - 0.1, zTop + 0.1, (y, z) => wallTextHit(text, u0, zTop, y1 - y, z, s) ? E(col) : T);
  tag(0); layer(0);
}
function neonTextY(yw, x0, u0, zTop, text, col, tg, sc) {
  const s = sc || 1, tw = textWidth(text) * s / 16;
  layer(zTop > ZCUT + 0.6 ? 1 : 0); mat(MAT_OUTSIDE); tag(tg || 0);
  cWallY(yw + 0.02, x0 + u0 - 0.1, x0 + u0 + tw + 0.1, zTop - 9 * s / 16 - 0.1, zTop + 0.1, (x, z) => wallTextHit(text, u0, zTop, x - x0, z, s) ? E(col) : T);
  tag(0); layer(0);
}
// vertical blade sign sticking out of a face. axis 'x': out of a +x face at (xw, yc); 'y': out of a +y face at (xc, yw)
function bladeSign(axis, a, b, z0, text, col, tg, body) {
  const n = text.length, z1 = z0 + n * 0.62 + 0.3, bc = body === undefined ? C.INK : body;
  const letter = (u, z) => {
    const i = Math.floor((z1 - 0.2 - z) / 0.62); if (i < 0 || i >= n) return T;
    const gw = charW(text.charCodeAt(i)) * 1.2 / 16, col0 = Math.floor((u - (0.45 - gw / 2)) * 16 / 1.2), row = Math.floor((z1 - 0.2 - i * 0.62 - z) * 16 / 1.2);
    return glyphBit(text[i], col0, row) ? E(col) : T;
  };
  layer(1); mat(MAT_OUTSIDE);
  if (axis === 'x') {
    cBox(a, b - 0.1, z0, a + 0.9, b + 0.1, z1, flat(bc), flat(C.S1), (x, z) => (x < a + 0.05 || x > a + 0.85 || z < z0 + 0.05 || z > z1 - 0.05) ? E(col) : bc);
    tag(tg || 0); cWallY(b + 0.103, a, a + 0.9, z0, z1, (x, z) => letter(x - a, z)); tag(0);
  } else {
    cBox(a - 0.1, b, z0, a + 0.1, b + 0.9, z1, flat(bc), (y, z) => (y < b + 0.05 || y > b + 0.85 || z < z0 + 0.05 || z > z1 - 0.05) ? E(col) : bc, flat(C.S1));
    tag(tg || 0); cWallX(a + 0.103, b, b + 0.9, z0, z1, (y, z) => letter(b + 0.9 - y, z)); tag(0);
  }
  layer(0);
}
// striped awning over a shopfront on a +y face (x0..x1 at yw) or a +x face (y0..y1 at xw)
function awningY(yw, x0, x1, z, c0, c1) {
  layer(1);
  cBox(x0, yw, z, x1, yw + 1.3, z + 0.12, (x) => frac(x / 0.5) < 0.5 ? c0 : c1, null, (x, zz) => frac(x / 0.5) < 0.5 ? c0 : c1);
  cWallY(yw + 1.3, x0, x1, z - 0.35, z, (x, zz) => (frac(x / 0.5) < 0.5 ? c0 : c1) === c0 && zz < z - 0.25 + Math.abs(frac(x / 0.5) - 0.25) * 0.4 ? T : (frac(x / 0.5) < 0.5 ? c0 : c1));
  layer(0);
}
function awningX(xw, y0, y1, z, c0, c1) {
  layer(1);
  cBox(xw, y0, z, xw + 1.3, y1, z + 0.12, (x, y) => frac(y / 0.5) < 0.5 ? c0 : c1, (y) => frac(y / 0.5) < 0.5 ? c0 : c1, null);
  cWallX(xw + 1.3, y0, y1, z - 0.35, z, (y, zz) => (frac(y / 0.5) < 0.5 ? c0 : c1));
  layer(0);
}

// =================================================================== STREET FURNITURE
function lampPost(x, y, noLight) {
  layer(0); mat(MAT_OUTSIDE);
  cCyl(x, y, 0.07, 0.15, 3.95, (a) => a < -0.2 ? C.S1 : C.S0);
  cCyl(x, y, 0.14, 0.15, 0.5, (a) => a < -0.2 ? C.S1 : C.S0, () => C.S1);
  mat(MAT_OUTSIDE | MAT_EMIT);
  cSphere(x, y, 4.12, 0.2, (nx, ny) => ny < -0.4 ? C.HOT : nx * nx + ny * ny > 0.75 ? C.GLOW : C.PALEY);
  mat(MAT_OUTSIDE);
  cCyl(x, y, 0.1, 4.3, 4.36, () => C.S0, () => C.S0);
  solidC(x, y, 0.16, 4, 'post');
  if (!noLight) addLight({ x, y, z: 4.1, r: 9, k: 3.6 });
}
function hydrant(x, y) {
  cCyl(x, y, 0.12, 0.15, 0.7, (a) => a < -0.3 ? C.RED : C.CRIM, () => C.CRIM);
  cCyl(x, y, 0.07, 0.7, 0.8, () => C.CRIM, () => C.RED);
  solidC(x, y, 0.16, 0.8, 'low');
}
function mailbox(x, y) {
  cBoxC(x - 0.22, y - 0.22, 0.15, x + 0.22, y + 0.22, 1.15, C.NBD, C.NAV, C.PNV);
  cStamp(x, y, 1.15, ['.nnn.', 'nnnnn'], { n: C.NBD });
  solid(x - 0.25, y - 0.25, x + 0.25, y + 0.25, 1.2, 'low');
}
function bench(x, y, axis) {
  const L = 0.9, D = 0.25;
  const [x0, y0, x1, y1] = axis === 'x' ? [x - L, y - D, x + L, y + D] : [x - D, y - L, x + D, y + L];
  cBox(x0, y0, 0.15, x1, y1, 0.55, (xx, yy) => frac((axis === 'x' ? yy : xx) / 0.1) < 0.35 ? C.DBR : C.WOOD, flat(C.INK), flat(C.INK));
  if (axis === 'x') cBoxC(x0, y0 - 0.08, 0.55, x1, y0, 0.95, C.WOOD, C.DBR, C.BRN); else cBoxC(x0 - 0.08, y0, 0.55, x0, y1, 0.95, C.WOOD, C.BRN, C.DBR);
  solid(x0, y0, x1, y1, 0.9, 'low');
}
function tree(x, y, s) {
  const k = s || 1;
  layer(0); mat(MAT_OUTSIDE);
  cFloor(x - 0.6, y - 0.6, x + 0.6, y + 0.6, 0.155, (xx, yy) => (frac(xx / 0.2) < 0.25 || frac(yy / 0.2) < 0.25) ? C.S0 : C.INK);
  cCyl(x, y, 0.13, 0.15, 2.4 * k, (a) => a < -0.2 ? C.BRN : C.DBR);
  layer(1);
  const blobs = [[0, 0, 3.4], [0.6, 0.2, 3.1], [-0.5, 0.4, 3.0], [0.2, -0.6, 3.6], [-0.3, -0.2, 4.0], [0.4, 0.5, 3.8]];
  for (const [dx, dy, dz] of blobs) cSphere(x + dx * k, y + dy * k, dz * k, 0.95 * k, (nx, ny, px, py) => {
    const v = -nx * 0.4 - ny * 0.8 + (hash(px, py) - 0.5) * 0.5;
    return v > 0.45 ? C.G2 : v > -0.1 ? C.G1 : C.G0;
  });
  layer(0);
  solidC(x, y, 0.2, 3, 'post');
}
function phoneBooth(x, y) {
  cBox(x - 0.45, y - 0.45, 0.15, x + 0.45, y + 0.45, 2.3, flat(C.CRIM), (yy, z) => z > 0.6 && z < 1.9 ? (bay(Math.floor(yy * 16), Math.floor(z * 16)) < 0.3 ? E(C.GLOW) : E(C.AMB)) : C.CRIM,
    (xx, z) => z > 0.6 && z < 1.9 && Math.abs(xx - x) < 0.35 ? E(C.AMB) : (z > 2.0 && z < 2.2 ? C.CREAM : C.CRIM));
  addLight({ x: x + 0.6, y: y + 0.6, z: 1.8, r: 2.4, k: 0.9 });
  solid(x - 0.45, y - 0.45, x + 0.45, y + 0.45, 2.3, 'wall');
}


// =================================================================== THE CITY: GRID, STREETS, SIDEWALKS
// Avenues run along y at AV[i], streets along x at ST[j]; roads are 12 m wide, right-hand traffic.
// Blocks (c, r) sit between them; the harbour is south of the last street and east of the last avenue.
const AV = [10, 44, 78, 112], ST = [10, 44, 78], RW = 6, SWK = 3, LN = 2.4, PARK = 5.0;
const MAP = { x0: -8, y0: -8, x1: 132, y1: 112 };
const HARBOUR_Y = 92, HARBOUR_X = 125, WATER_Z = -0.8;
function blockRect(c, r) { return [AV[c] + RW, ST[r] + RW, AV[c + 1] - RW, ST[r + 1] - RW]; }
function slab(x0, y0, x1, y1, sh, kerbX, kerbY) {
  layer(0); mat(MAT_OUTSIDE);
  cFloor(x0, y0, x1, y1, 0.15, sh);
  if (kerbX) cWallX(x1, y0, y1, 0, 0.15, flat(C.ST1));
  if (kerbY) cWallY(y1, x0, x1, 0, 0.15, flat(C.ST1));
  CITY.slabs.push([x0, y0, x1, y1]);
}
// sidewalk flagstones within SWK of a block edge, cobbles inside (courtyards, alleys)
function blockSh(x0, y0, x1, y1, seed) {
  const walk = flagstones(C.ST1, C.VIO, C.ST0, seed, 0.7), cob = flagstones(C.INK, C.ST0, C.BLK, seed + 1, 0.3);
  return (x, y, px, py) => {
    const e = Math.min(x - x0, y - y0, x1 - x, y1 - y);
    if (e < 0.22) return C.ST2;                                              // kerbstone
    if (e < SWK) return walk(x, y, px, py);
    return cob(x, y, px, py);
  };
}
const ROAD_ASPH = (x, y, px, py) => { const v = vnoise(x * 1.7, y * 1.7, 19) * 0.6 + vnoise(x * 6, y * 6, 20) * 0.25 + hash(px, py) * 0.15; return v > 0.66 ? C.SLT : v > 0.36 ? C.NAV : C.INK; };
// a road segment along x (axis 0) or y (axis 1) centred on c; rails for the streetcar line
function roadSh(axis, c, rails) {
  return (x, y, px, py) => {
    const a = axis ? x : y, l = axis ? y : x, d = a - c, ad = Math.abs(d);
    if (rails) { const r = Math.abs(ad - 0.72); if (r < 0.035) return C.S1; if (r < 0.09) return C.BLK; }
    else if (ad < 0.06 && frac(l / 3.2) < 0.5) return C.CRS;                  // centre dashes
    if (ad > RW - 0.12) return C.BLK;                                          // gutter
    return ROAD_ASPH(x, y, px, py);
  };
}
function crossingSh(axis) {           // zebra stripes across a road, stripes run along its length
  return (x, y) => frac((axis ? x : y) / 0.9) < 0.45 ? C.ST1 : T;
}
function buildGround() {
  layer(0);
  // ---- roads
  mat(MAT_OUTSIDE | MAT_GLOSS);
  const aY0 = ST[0] - RW, aY1 = ST[2] + RW, sX0 = AV[0] - RW, sX1 = AV[3] + RW;
  for (let i = 0; i < AV.length; i++) for (let j = 0; j < ST.length - 1; j++)
    cFloor(AV[i] - RW, ST[j] + RW, AV[i] + RW, ST[j + 1] - RW, 0, roadSh(1, AV[i], i === 1));
  for (let j = 0; j < ST.length; j++) for (let i = 0; i < AV.length - 1; i++)
    cFloor(AV[i] + RW, ST[j] - RW, AV[i + 1] - RW, ST[j] + RW, 0, roadSh(0, ST[j], false));
  for (const x of AV) for (const y of ST) cFloor(x - RW, y - RW, x + RW, y + RW, 0, (xx, yy, px, py) => {
    if (x === AV[1]) { const r = Math.abs(Math.abs(xx - x) - 0.72); if (r < 0.035) return C.S1; if (r < 0.09) return C.BLK; }
    return ROAD_ASPH(xx, yy, px, py);
  });
  // zebra crossings on each side of every intersection
  mat(MAT_OUTSIDE);
  for (const x of AV) for (const y of ST) {
    cFloor(x - RW + 0.3, y - RW - 3.2, x + RW - 0.3, y - RW - 0.6, 0.001, crossingSh(1));
    cFloor(x - RW + 0.3, y + RW + 0.6, x + RW - 0.3, y + RW + 3.2, 0.001, crossingSh(1));
    cFloor(x - RW - 3.2, y - RW + 0.3, x - RW - 0.6, y + RW - 0.3, 0.001, crossingSh(0));
    cFloor(x + RW + 0.6, y - RW + 0.3, x + RW + 3.2, y + RW - 0.3, 0.001, crossingSh(0));
  }
  // manholes
  for (let k = 0; k < 18; k++) {
    const onAv = k & 1, i = hashi(k, 3) % (onAv ? 4 : 3), t = 0.2 + hash(k, 4) * 0.6;
    const x = onAv ? AV[i] + (hash(k, 5) - 0.5) * 6 : lerp(AV[0] + RW, AV[3] - RW, t), y = onAv ? lerp(ST[0] + RW, ST[2] - RW, t) : ST[i] + (hash(k, 5) - 0.5) * 6;
    cFloor(x - 0.45, y - 0.45, x + 0.45, y + 0.45, 0.002, (xx, yy) => { const d = Math.hypot(xx - x, yy - y); return d > 0.42 ? T : d > 0.36 ? C.BLK : (frac((xx + yy) / 0.12) < 0.3 ? C.ST0 : C.INK); });
  }
  // ---- block slabs and the outer sidewalks
  for (let c = 0; c < 3; c++) for (let r = 0; r < 2; r++) {
    const b = blockRect(c, r);
    slab(b[0], b[1], b[2], b[3], (c === 1 && r === 1) ? plazaSh(b) : blockSh(b[0], b[1], b[2], b[3], 7 + c * 3 + r), true, true);
  }
  const walkN = flagstones(C.ST1, C.VIO, C.ST0, 51, 0.7);
  slab(1, 1, sX1 + SWK + 4, aY0, (x, y, px, py) => y > aY0 - 0.22 ? C.ST2 : walkN(x, y, px, py), false, true);          // north sidewalk
  slab(1, aY0, sX0, HARBOUR_Y, (x, y, px, py) => x > sX0 - 0.22 ? C.ST2 : walkN(x, y, px, py), true, false);              // west sidewalk
  slab(sX1, aY0, HARBOUR_X, aY1, (x, y, px, py) => x < sX1 + 0.22 ? C.ST2 : (x > sX1 + SWK ? boardSh(x, y, px, py, 0) : walkN(x, y, px, py)), false, false);
  slab(sX0, aY1, HARBOUR_X, HARBOUR_Y, (x, y, px, py) => y < aY1 + 0.22 ? C.ST2 : (y > aY1 + SWK ? boardSh(x, y, px, py, 1) : walkN(x, y, px, py)), false, false);
  // ---- puddles on roads and sidewalks
  mat(MAT_OUTSIDE | MAT_PUDDLE);
  for (let k = 0; k < 90; k++) {
    const x = lerp(2, 122, hash(k, 61)), y = lerp(2, 90, hash(k, 62)), rx = 0.5 + hash(k, 63) * 1.3, ry = 0.3 + hash(k, 64) * 0.6;
    const z = groundZAt(x, y) + 0.002;
    cFloor(x - rx, y - ry, x + rx, y + ry, z, (xx, yy) => ((xx - x) / rx) ** 2 + ((yy - y) / ry) ** 2 + (vnoise(xx * 3, yy * 3, 23) - 0.5) * 0.6 < 1 ? C.NAV : T);
  }
  mat(MAT_OUTSIDE);
}
function boardSh(x, y, px, py, axis) {                       // harbour boardwalk planks
  const u = axis ? x : y, v = axis ? y : x;
  if (frac(v / 0.3) < 0.12) return C.INK;
  return hash3(Math.floor(v / 0.3), Math.floor(u / 2.4 + (Math.floor(v / 0.3) & 1) * 0.5), 9) > 0.7 ? C.BRN : C.DBR;
}
function plazaSh(b) {
  const walk = flagstones(C.ST1, C.VIO, C.ST0, 71, 0.7), cx = (b[0] + b[2]) / 2, cy = (b[1] + b[3]) / 2;
  return (x, y, px, py) => {
    const e = Math.min(x - b[0], y - b[1], b[2] - x, b[3] - y);
    if (e < 0.22) return C.ST2;
    if (e < SWK) return walk(x, y, px, py);
    const d = Math.hypot(x - cx, y - cy), ring = frac(d / 1.6);
    if (ring < 0.08) return C.ST0;                                               // concentric paving rings
    return hash3(Math.floor(d / 1.6), Math.floor(Math.atan2(y - cy, x - cx) * d / 1.2), 3) > 0.8 ? C.STS : C.ST2;
  };
}
// ------------------------------------------------------------------ ground height (0 road, 0.15 slab)
let SURF = null;
function groundZAt(x, y) {
  for (const s of CITY.slabs) if (x >= s[0] && x < s[2] && y >= s[1] && y < s[3]) return 0.15;
  return 0;
}
function buildSurf() {
  const gw = MAP.x1 - MAP.x0, gh = MAP.y1 - MAP.y0;
  SURF = { g: new Uint8Array(gw * gh * 4), gw: gw * 2, gh: gh * 2 };
  for (let j = 0; j < SURF.gh; j++) for (let i = 0; i < SURF.gw; i++) {
    const x = MAP.x0 + (i + 0.5) / 2, y = MAP.y0 + (j + 0.5) / 2;
    let v = groundZAt(x, y) > 0 ? 1 : 0;
    if ((y > HARBOUR_Y || x > HARBOUR_X) && !onPier(x, y)) v = 2;
    SURF.g[j * SURF.gw + i] = v;
  }
}
function surfAt(x, y) {
  const i = Math.floor((x - MAP.x0) * 2), j = Math.floor((y - MAP.y0) * 2);
  if (i < 0 || j < 0 || i >= SURF.gw || j >= SURF.gh) return 2;
  return SURF.g[j * SURF.gw + i];
}
function groundZ(x, y) { const s = surfAt(x, y); return s === 1 ? 0.15 : s === 2 ? WATER_Z : 0; }

// ------------------------------------------------------------------ street lamps, hydrants, mailboxes along the sidewalks
function buildStreetFurniture() {
  layer(0); mat(MAT_OUTSIDE);
  const lampsAlongX = (y, xa, xb) => { for (let x = xa; x <= xb; x += 15) lampPost(x, y); };
  const lampsAlongY = (x, ya, yb) => { for (let y = ya; y <= yb; y += 15) lampPost(x, y); };

// ------------------------------------------------------------------ the road graph (traffic, the sedan's route)
// node id = i * 3 + j at (AV[i], ST[j]); lane point for travel along direction (dx, dy) is offset to the right
function nodeXY(n) { return [AV[Math.floor(n / 3)], ST[n % 3]]; }
function nodeNeighbours(n) {
  const i = Math.floor(n / 3), j = n % 3, out = [];
  if (i > 0) out.push(n - 3); if (i < 3) out.push(n + 3); if (j > 0) out.push(n - 1); if (j < 2) out.push(n + 1);
  return out;
}
function laneOffset(dx, dy) { return [-dy * LN, dx * LN]; }     // right-hand side of travel (+y is clockwise of +x seen from above)
// polyline through a node sequence, with lane offsets and corner points at the turns
function lanePath(nodes) {
  const pts = [];
  for (let k = 0; k < nodes.length; k++) {
    const p = nodeXY(nodes[k]);
    if (k === 0 || k === nodes.length - 1) {
      const q = nodeXY(nodes[k === 0 ? 1 : k - 1]), dx = Math.sign(k === 0 ? q[0] - p[0] : p[0] - q[0]), dy = Math.sign(k === 0 ? q[1] - p[1] : p[1] - q[1]);
      const o = laneOffset(dx, dy); pts.push([p[0] + o[0], p[1] + o[1]]); continue;
    }
    const a = nodeXY(nodes[k - 1]), b = nodeXY(nodes[k + 1]);
    const d1 = [Math.sign(p[0] - a[0]), Math.sign(p[1] - a[1])], d2 = [Math.sign(b[0] - p[0]), Math.sign(b[1] - p[1])];
    const o1 = laneOffset(d1[0], d1[1]), o2 = laneOffset(d2[0], d2[1]);
    if (d1[0] === d2[0] && d1[1] === d2[1]) { pts.push([p[0] + o1[0], p[1] + o1[1]]); continue; }
    // corner: the incoming lane line meets the outgoing lane line
    pts.push([d1[0] ? p[0] + o2[0] : p[0] + o1[0], d1[1] ? p[1] + o2[1] : p[1] + o1[1]]);
  }
  return pts;
}
